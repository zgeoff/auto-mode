# Secret-scanning config for gitleaks (PR job + pre-commit hook). Extends the
# default ruleset; every allowlist is scoped to the rules its files actually
# trip, so any other kind of secret in those files still flags.

[extend]
useDefault = true

[[allowlists]]
targetRules = ["private-key", "jwt"]
description = "test files hold intentionally fake keys and tokens"
paths = ['''\.test\.ts$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "fixtures are recorded mod requests and corpora with placeholder values"
paths = ['''^fixtures/''', '''^evals/corpora/''']

[[allowlists]]
targetRules = ["sourcegraph-access-token"]
description = "the bundled secret rule set records the upstream commit sha, which reads as a token"
paths = ['''^src/secrets/betterleaks-rules\.ts$''']
