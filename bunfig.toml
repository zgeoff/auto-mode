# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their own dependencies stay behind it.
# Renovate bumps @zgeoff packages as soon as they publish, so each one
# auto-mode uses needs an entry here, or bun install refuses the bump.
minimumReleaseAgeExcludes = [
  "@zgeoff/agent-hooks",
  "@zgeoff/bun-test-extended",
  "@zgeoff/chex",
  "@zgeoff/diet",
  "@zgeoff/format-codemod",
  "@zgeoff/oxlint-config",
  "@zgeoff/rig",
  "@zgeoff/std",
  "@zgeoff/testing",
]

[test]
# registers the jest-extended matchers, restores env vars, starts the fetch network, then the shared setup for `bun test`
preload = [
  "@zgeoff/bun-test-extended",
  "@zgeoff/testing/preload",
  "./src/test-utils/mocks/network.ts",
  "./src/test-utils/test-setup.ts",
]
