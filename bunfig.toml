# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# @zgeoff/oxlint-config, a first-party package, is pinned to a release younger
# than the gate; each pinned version's provenance is checked before the pin, and
# its own dependencies stay behind the gate.
minimumReleaseAgeExcludes = ["@zgeoff/oxlint-config"]

[test]
# registers the jest-extended matchers, then the shared setup and resets for `bun test`
preload = ["@zgeoff/bun-test-extended", "./test-setup.ts"]
