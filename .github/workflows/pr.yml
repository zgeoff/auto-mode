name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The shared Bun checks: separate gitleaks, static, test and test-<lane> jobs
  # in a public repo, and one checks job in a private one. In both, the checks
  # job fails when any check fails, so the ruleset requires `pr / checks`.
  pr:
    # the gitleaks job comments findings on the PR, which needs write on
    # pull-requests
    permissions:
      contents: read
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/bun-checks.yml@eb4732a2addff80012a05eb20c7ef9de8331a32f # main
    with:
      scripts: ${{ vars.BUN_CHECK_SCRIPTS }}
      node-version: ${{ vars.NODE_VERSION }}
      timeout-minutes: ${{ fromJSON(vars.BUN_CHECK_TIMEOUT_MINUTES || '20') }}
      # e2e/package-install.test.ts scans the packed package with gitleaks
      setup-gitleaks: true
