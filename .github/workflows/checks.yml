name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # a hung step (a script that never exits, a wedged process) must fail the
    # run, not burn runner hours
    timeout-minutes: 10
    env:
      # CI never commits, but skip hook install and execution regardless
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the published artifact targets node, so the e2e suite runs it under the
      # oldest node the package claims to support
      - name: Set up node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # the corpus anonymiser's secret gate runs the gitleaks binary, so its
      # tests need it; the version matches the PR job's gitleaks scan
      - name: Set up gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # pinned release binaries, so the lint result does not move with the
      # runner image's preinstalled shellcheck
      - name: Set up shellcheck, shfmt and actionlint
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          SHFMT_VERSION: 3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          bin="$RUNNER_TEMP/linters"
          mkdir -p "$bin"
          shellcheck_archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$shellcheck_archive" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$shellcheck_archive"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$shellcheck_archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$shellcheck_archive" -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl -sSfL -o "$bin/shfmt" "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  $bin/shfmt" | sha256sum --check --strict
          chmod +x "$bin/shfmt"
          actionlint_archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$actionlint_archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$actionlint_archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$actionlint_archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$actionlint_archive" -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit

      - name: Dead code
        run: bun run deadcode

      - name: Shellcheck
        run: bun run lint:shellcheck

      - name: Shfmt
        run: bun run lint:shfmt

      - name: Actionlint
        run: bun run lint:actionlint

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint:full

      # check-length.sh runs check-prose.sh over the same READMEs and docs/
      - name: Doc length and prose
        run: bash .claude/skills/docs-writing/scripts/check-length.sh

      - name: Doc links
        run: bash .claude/skills/docs-writing/scripts/check-links.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint the published package
        run: bun run publint
