name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # a hung step (a script that never exits, a wedged process) must fail the
    # run, not burn runner hours
    timeout-minutes: 10
    env:
      # CI never commits, but skip hook install and execution regardless
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the published artifact targets node, so the e2e suite runs it under the
      # oldest node the package claims to support
      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # the corpus anonymiser's secret gate runs the gitleaks binary, so its
      # tests need it; the version matches the PR job's gitleaks scan
      - name: Set up gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit

      - name: Check AGENTS.md drift
        run: |
          bun run build:agents
          git diff --exit-code AGENTS.md agents/ scripts/build-agents-md.sh

      - name: Dead code
        run: bun run deadcode

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Module boundaries
        run: bun run check:imports

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint the published package
        run: bun run publint
