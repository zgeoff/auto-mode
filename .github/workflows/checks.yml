name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # a hung step (a script that never exits, a wedged process) must fail the
    # run, not burn runner hours
    timeout-minutes: 10
    env:
      # CI never commits, but skip hook install and execution regardless
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the published artifact targets node, so the e2e suite runs it under the
      # oldest node the package claims to support
      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Set up gitleaks, shellcheck, shfmt and actionlint
        run: bun run setup:ci-tools

      - name: Install
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit

      - name: Dead code
        run: bun run deadcode

      - name: Shellcheck
        run: bun run lint:shellcheck

      - name: Shfmt
        run: bun run lint:shfmt

      - name: Actionlint
        run: bun run lint:actionlint

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint:full

      # check-length.sh runs check-prose.sh over the same READMEs and docs/
      - name: Doc length and prose
        run: bash .claude/skills/docs-writing/scripts/check-length.sh

      - name: Doc links
        run: bash .claude/skills/docs-writing/scripts/check-links.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # builds the package as the release does, so publint lints the files
      # that ship and tsdown's declaration step runs on every pull request
      - name: Build
        run: bun run build

      - name: Lint the published package
        run: bun run publint
