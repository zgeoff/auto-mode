name: main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Recovery path for a release that tagged but failed to publish: skips
      # the release-please steps and re-runs only the publish step. A version
      # already on the registry is skipped, so this is safe to re-run.
      republish:
        description: 'Republish the current version'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Trusted publishing. No npm token exists anywhere in this repository.
      id-token: write
    steps:
      # A release takes two runs of this job:
      # - Run 1, after a releasable commit lands on main: release-please opens
      #   or updates the release PR (version bump + changelog), and auto-merge
      #   merges it once its checks pass.
      # - Run 2, triggered by that merge: release-please turns the merged bump
      #   into a tag and a GitHub release, and the publish step ships to npm.
      #
      # The App token exists because GITHUB_TOKEN events do not trigger
      # workflows, so a GITHUB_TOKEN merge of the release PR would never start
      # run 2. With no App configured, release PRs are left open to merge by
      # hand and the chain continues from there. See RELEASING.md.
      - name: Mint GitHub App token
        id: app-token
        if: github.event_name == 'push' && vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      # No lockfile repair step: bun.lock records dependency versions but not
      # the package's own version, so a release-please bump leaves it valid.

      # Mergeability is recomputed asynchronously after release-please pushes,
      # and a MERGEABLE read can be stale, so the merge attempt retries inside
      # the same loop rather than trusting a single read.
      - name: Auto-merge the release PR
        if: github.event_name == 'push' && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --head release-please--branches--main --json number --jq '.[].number'); do
            merged=''
            for _ in $(seq 1 12); do
              state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeable --jq .mergeable)
              if [ "$state" = "CONFLICTING" ]; then
                echo "release PR #$pr has conflicts" >&2
                exit 1
              fi
              if [ "$state" = "MERGEABLE" ] && gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash; then
                merged=1
                break
              fi
              sleep 5
            done
            if [ -z "$merged" ]; then
              echo "release PR #$pr never became mergeable" >&2
              exit 1
            fi
          done

      - name: Check out the merged release
        if: steps.release.outputs.releases_created == 'true' || inputs.republish
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up bun for publish
        if: steps.release.outputs.releases_created == 'true' || inputs.republish
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # npm does the publishing, not bun: trusted publishing (OIDC) needs
      # npm >= 11.5.1 — node 24 bundles at least 11.16 — and bun publish has no
      # OIDC support (oven-sh/bun#15601). Never upgrade the bundled npm in
      # place: a cross-major overlay prunes transitive dependencies that
      # libnpmpublish needs at publish time (sigstore).
      - name: Set up node for publish
        if: steps.release.outputs.releases_created == 'true' || inputs.republish
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.release.outputs.releases_created == 'true' || inputs.republish
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.release.outputs.releases_created == 'true' || inputs.republish
        run: bun run build

      # The registry check makes this idempotent: a re-run after a failed
      # publish skips a version already on npm instead of erroring.
      - name: Publish
        if: steps.release.outputs.releases_created == 'true' || inputs.republish
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "skipping $name@$version: already published"
            exit 0
          fi
          # bun pm pack resolves any bun-specific manifest fields at pack time;
          # npm publishes the tarball it produced.
          bun pm pack
          npm publish ./*.tgz --provenance --access public
