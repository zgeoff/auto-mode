name: main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # The publish path: a push run dispatches main.yml with this input at
      # the release tag, and a person dispatches it to recover a release that
      # tagged but did not publish. A version already on the registry is
      # skipped, so this is safe to re-run.
      republish:
        description: 'Publish the version at this ref when npm lacks it'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Keyed by ref, so a push to main never cancels the checks of a publish run
  # dispatched at a release tag. A newer dispatch at the same tag cancels the
  # older one's checks and publishes in its place.
  checks:
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/checks.yml

  # The shared job opens or updates the release PR, merges it once its checks
  # pass, and tags the merge in the same run. It waits for no checks job, so
  # the tag lands while the merge commit is still main's head. With no App
  # configured, release PRs are left open to merge by hand, and the run of
  # that merge's push tags the release. See RELEASING.md.
  release:
    if: github.event_name == 'push'
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/release-please.yml@aaf6a2a72a29ad1edc6c512dd122f0e3d84a0ebf # main
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
      merge: true
      # release-please names the release PR's branch after the package's
      # component, so the merge step looks for that branch.
      release-branch: release-please--branches--main--components--auto-mode
      # bun.lock records dependency versions but not the package's own
      # version, so a release-please bump leaves it valid.
      sync-command: ''
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # npm provenance records the run's own commit as the package's source, and
  # the release tag lands on a commit after this run's, so a push run never
  # publishes: it dispatches a publish run at the oldest release tag newer
  # than npm's latest. It needs no checks job, so a newer push that cancels this
  # run's checks loses no release, and it waits for the release job so that
  # the tag the release job makes is there to read.
  release-dispatch:
    needs: release
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-dispatch
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      # Dispatches main.yml at the release tag.
      actions: write
    steps:
      - name: Check out the run's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dispatch a publish run at the oldest unpublished tag
        env:
          GH_TOKEN: ${{ github.token }}
          CAN_PUBLISH_HERE: 'false'
        run: bun run check:publish

  release-publish:
    needs: checks
    if: inputs.republish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # queue: max keeps every waiting run; the default replaces a waiting run,
    # which would cancel a pending publish run.
    concurrency:
      group: release-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      # Trusted publishing. No npm token exists anywhere in this repository.
      id-token: write
      # A dispatch at a ref other than the tag dispatches again at the tag.
      actions: write
    steps:
      - name: Check out the run's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # npm does the publishing, not bun: trusted publishing (OIDC) needs
      # npm >= 11.5.1 — node 24 bundles at least 11.16 — and bun publish has no
      # OIDC support (oven-sh/bun#15601). Never upgrade the bundled npm in
      # place: a cross-major overlay prunes transitive dependencies that
      # libnpmpublish needs at publish time (sigstore).
      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the registry for the version
        id: publish-check
        env:
          GH_TOKEN: ${{ github.token }}
          CAN_PUBLISH_HERE: 'true'
        run: bun run check:publish

      - name: Build
        if: steps.publish-check.outputs.publish == 'true'
        run: bun run build

      # bun pm pack resolves any bun-specific manifest fields at pack time;
      # npm publishes the tarball it produced.
      - name: Pack
        if: steps.publish-check.outputs.publish == 'true'
        run: bun pm pack

      - name: Publish
        if: steps.publish-check.outputs.publish == 'true'
        run: npm publish ./*.tgz --provenance --access public

      # Releases publish oldest first, so a newer pending tag waits for this
      # one; once it is on npm, the next pending tag gets its run.
      - name: Dispatch a publish run at the next unpublished tag
        if: steps.publish-check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CAN_PUBLISH_HERE: 'false'
        run: bun run check:publish
