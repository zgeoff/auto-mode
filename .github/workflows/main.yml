name: main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Recovery path for a release that tagged but failed to publish: skips
      # the release-please steps and re-runs only the publish steps. A version
      # already on the registry is skipped, so this is safe to re-run.
      republish:
        description: 'Republish the current version'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    concurrency:
      group: main-checks
      cancel-in-progress: true
    uses: ./.github/workflows/checks.yml

  # A cancel between release-please tagging a release and npm publishing it would leave the
  # release unpublished, so a newer push queues this job instead of cancelling it.
  release:
    needs: checks
    concurrency:
      group: main-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Trusted publishing. No npm token exists anywhere in this repository.
      id-token: write
    steps:
      # A release takes two runs of this job:
      # - Run 1, after a releasable commit lands on main: release-please opens
      #   or updates the release PR (version bump + changelog), and auto-merge
      #   merges it once its checks pass.
      # - Run 2, triggered by that merge: release-please turns the merged bump
      #   into a tag and a GitHub release, and the publish steps ship to npm.
      #
      # The App token exists because GITHUB_TOKEN events do not trigger
      # workflows, so a GITHUB_TOKEN merge of the release PR would never start
      # run 2. With no App configured, release PRs are left open to merge by
      # hand and the chain continues from there. See RELEASING.md.
      - name: Check out the run's commit
        if: github.event_name == 'push' || inputs.republish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        if: github.event_name == 'push' || inputs.republish
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # npm does the publishing, not bun: trusted publishing (OIDC) needs
      # npm >= 11.5.1 — node 24 bundles at least 11.16 — and bun publish has no
      # OIDC support (oven-sh/bun#15601). Never upgrade the bundled npm in
      # place: a cross-major overlay prunes transitive dependencies that
      # libnpmpublish needs at publish time (sigstore).
      - name: Set up node
        if: github.event_name == 'push' || inputs.republish
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        if: github.event_name == 'push' || inputs.republish
        run: bun install --frozen-lockfile

      - name: Mint GitHub App token
        id: app-token
        if: github.event_name == 'push' && vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      # No lockfile repair step: bun.lock records dependency versions but not
      # the package's own version, so a release-please bump leaves it valid.

      - name: Auto-merge the release PR
        if: github.event_name == 'push' && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun run release:merge

      # The publish gate is the registry, not releases_created: release-please
      # tags a release PR merged after this run started, while the checkout
      # holds the commit before it, so the run on the release commit finds the
      # release made and reports none created.
      - name: Check the registry for the version
        id: publish-check
        if: github.event_name == 'push' || inputs.republish
        run: bun run check:publish

      - name: Build
        if: steps.publish-check.outputs.publish == 'true'
        run: bun run build

      # bun pm pack resolves any bun-specific manifest fields at pack time;
      # npm publishes the tarball it produced.
      - name: Pack
        if: steps.publish-check.outputs.publish == 'true'
        run: bun pm pack

      - name: Publish
        if: steps.publish-check.outputs.publish == 'true'
        run: npm publish ./*.tgz --provenance --access public
